<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>诗班排练中心</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
</head>
<body>
  <!-- 登录页 -->
  <div id="login-page" class="page active">
    <div class="login-container">
      <div class="login-header">
        <i class="fas fa-music"></i>
        <h1>诗班排练中心</h1>
        <p>用歌声赞美，用心灵敬拜</p>
      </div>
      <div class="login-form">
        <div class="role-selector">
          <button class="role-btn active" data-role="student">
            <i class="fas fa-user"></i> 学员登录
          </button>
          <button class="role-btn" data-role="conductor">
            <i class="fas fa-baton"></i> 指挥登录
          </button>
        </div>
        <input type="text" id="login-name" placeholder="请输入姓名" autocomplete="off">
        <button id="login-btn" class="btn btn-primary">进入</button>
        <button id="register-btn" class="btn btn-outline" style="width:100%;margin-top:10px;"><i class="fas fa-user-plus"></i> 还没有账号？注册</button>
        <div style="font-size:12px;color:var(--text-muted);margin-top:10px;">学员注册后凭姓名直接登录，无需选择声部</div>
      </div>
    </div>
  </div>

  <!-- 主应用 -->
  <div id="app" class="page">
    <!-- 顶部导航 -->
    <header class="app-header">
      <div class="header-left">
        <i class="fas fa-music"></i>
        <span class="app-title">诗班排练中心</span>
      </div>
      <div class="header-right">
        <span id="user-info" class="user-info"></span>
        <button id="logout-btn" class="btn btn-small btn-outline">退出</button>
      </div>
    </header>

    <!-- 底部导航 -->
    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="schedule">
        <i class="fas fa-calendar-alt"></i>
        <span>排练</span>
      </button>
      <button class="tab-btn" data-tab="practice">
        <i class="fas fa-book-open"></i>
        <span>练习</span>
      </button>
      <button class="tab-btn" data-tab="checkin">
        <i class="fas fa-check-circle"></i>
        <span>打卡</span>
      </button>
      <button class="tab-btn" data-tab="recordings">
        <i class="fas fa-microphone"></i>
        <span>录音</span>
      </button>
      <!-- 指挥端额外标签 -->
      <button class="tab-btn conductor-only" data-tab="manage">
        <i class="fas fa-users-cog"></i>
        <span>管理</span>
      </button>
      <button class="tab-btn conductor-only" data-tab="review">
        <i class="fas fa-headphones"></i>
        <span>检查</span>
      </button>
    </nav>

    <!-- 内容区域 -->
    <main class="content">
      <!-- 排练日程 -->
      <section id="tab-schedule" class="tab-content active"></section>

      <!-- 练习作业 -->
      <section id="tab-practice" class="tab-content"></section>

      <!-- 打卡 -->
      <section id="tab-checkin" class="tab-content"></section>

      <!-- 录音上传 -->
      <section id="tab-recordings" class="tab-content"></section>

      <!-- 指挥：管理 -->
      <section id="tab-manage" class="tab-content conductor-only"></section>

      <!-- 指挥：检查作业 -->
      <section id="tab-review" class="tab-content conductor-only"></section>
    </main>
  </div>

  <!-- 模态框 -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close"><i class="fas fa-times"></i></button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Toast 提示 -->
  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
  <script src="js/plans-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
